<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · UNPHUPED</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F7F5'/%3E%3Cpath d='M11 8v16M21 8v16M11 17h10M11 8a5 5 0 1 0 0 10M21 8a5 5 0 1 1 0 10' stroke='%23000' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#F7F7F5;
    --ink:#000000;
    --muted:#5C5A55;
    --rule:#D8D6D0;
    --seal:#E0A53A;
    --slab:#EFEEEA;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:52rem;
    margin:0 auto;
    padding:3rem 1.5rem;
    width:100%;
  }
  .doc{
    border-left:1px solid var(--rule);
    padding-left:clamp(1rem,4vw,3rem);
  }
  .wordmark{
    font-family:"IBM Plex Mono",monospace;
    font-weight:600;
    font-size:1.05rem;
    letter-spacing:.14em;
    margin:0 0 2.5rem;
  }
  .slip{
    background:var(--slab);
    border:1px solid var(--rule);
    font-family:"IBM Plex Mono",monospace;
    font-size:.86rem;
    line-height:1.75;
    max-width:34rem;
  }
  .slip-row{
    display:grid;
    grid-template-columns:7.5rem 1fr;
    gap:0 1rem;
    padding:.85rem 1.1rem;
  }
  .slip-row + .slip-row{border-top:1px solid var(--rule)}
  .slip-key{color:var(--muted)}
  .slip-val{overflow-wrap:anywhere}
  .verdict{background:var(--ink);color:var(--paper)}
  .verdict .slip-key{color:#9A968E}
  .no{color:var(--seal);font-weight:600}
  p{max-width:34rem}
  a{color:var(--ink);text-decoration:underline;text-underline-offset:.18em}
  a:focus-visible{outline:2px solid var(--seal);outline-offset:3px}
  @media (max-width:560px){
    .slip-row{grid-template-columns:1fr;gap:.15rem}
    .doc{border-left:none;padding-left:0}
  }
</style>
</head>
<body>
<div class="wrap">
<div class="doc">
  <p class="wordmark">UNPHUPED</p>

  <div class="slip">
    <div class="slip-row">
      <span class="slip-key">requested</span>
      <span class="slip-val" id="path">this page</span>
    </div>
    <div class="slip-row verdict">
      <span class="slip-key">verdict</span>
      <span class="slip-val"><span class="no">NOT FOUND</span></span>
    </div>
  </div>

  <p>Not found is not empty. This address does not resolve to anything on this site, which is a different statement from saying nothing exists here.</p>
  <p><a href="/">Go to the front page</a></p>
</div>
</div>
<script>
  var el = document.getElementById('path');
  if (el) { el.textContent = location.pathname.slice(0, 120) || 'this page'; }
</script>
</body>
</html>
